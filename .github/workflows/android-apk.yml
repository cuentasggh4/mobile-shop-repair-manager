name: Build & Release Android APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release version tag (e.g. v1.0, v1.1)'
        required: true
        default: 'v1.0'

permissions:
  contents: write

jobs:
  build-release-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Decode permanent release keystore
        env:
          KEYSTORE_B64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_B64" ] || [ -z "$STORE_PASSWORD" ] || [ -z "$KEY_PASSWORD" ]; then
            echo "::error::Missing signing secrets (RELEASE_KEYSTORE_BASE64, STORE_PASSWORD, KEY_PASSWORD). Add them in GitHub Repo Settings -> Secrets and variables -> Actions to keep your package signature & SHA-1 consistent."
            exit 1
          fi
          echo "$KEYSTORE_B64" | base64 --decode > "${{ runner.temp }}/release-keystore.jks"

      - name: Build signed Release APK
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/release-keystore.jks
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: gradle :app:assembleRelease --no-daemon

      - name: Determine release tag
        id: meta
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=${{ inputs.tag_name }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          fi

      - name: Rename Release APK
        run: |
          cp app/build/outputs/apk/release/app-release.apk \
             "app/build/outputs/apk/release/MobileRepairShop-${{ steps.meta.outputs.tag }}.apk"

      - name: Publish GitHub Release with APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: "Mobile Repair Shop ${{ steps.meta.outputs.tag }}"
          generate_release_notes: true
          files: app/build/outputs/apk/release/MobileRepairShop-${{ steps.meta.outputs.tag }}.apk
